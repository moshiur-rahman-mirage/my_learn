# All values can be overridden by environment variables (Spring relaxed binding),
# e.g. APP_DATA_DIR=/data, SERVER_PORT=9090.
app:
  data-dir: ./data
  backup:
    automatic: true   # VACUUM INTO <data-dir>/backups when the newest backup is older than 20h
    keep: 14          # number of backup files to keep

server:
  port: 8080

spring:
  application:
    name: learning-tracker

  servlet:
    multipart:
      max-file-size: 200MB   # large enough to restore a backup file
      max-request-size: 200MB

  datasource:
    # foreign_keys: SQLite ignores FKs unless enabled per connection.
    # journal_mode=WAL: crash-safe, readers don't block the writer.
    # busy_timeout: wait instead of failing immediately if the file is locked (e.g. during a backup).
    url: jdbc:sqlite:${app.data-dir}/learning-tracker.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows a single writer. One pooled connection serializes access and
      # avoids SQLITE_BUSY lock-upgrade errors; plenty for a single-user app.
      maximum-pool-size: 1

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Not "validate": SQLite type affinity (INTEGER PRIMARY KEY vs BIGINT,
      # 0/1 booleans) makes Hibernate's validator report false mismatches. Integration tests
      # round-trip every mapped column instead.
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
