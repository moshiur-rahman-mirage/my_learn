# Profile used by the installed Windows app (scripts/build-installer.ps1 → DesktopLauncher).
# The port is passed by the launcher as -Dserver.port (default 38427).
app:
  # The install folder is not writable, so data lives in the user's profile.
  data-dir: ${LOCALAPPDATA:${user.home}}/LearningTracker/data

server:
  # Listen on the local network too, so the phone app can sync over Wi-Fi. Everything except the
  # token-protected sync endpoints stays this-PC-only: RemoteAccessFilter answers 403 to any other
  # request from another device (docs/SYNC_PROTOCOL.md §5). Windows asks once whether to allow it;
  # allow "Private networks".
  address: 0.0.0.0

logging:
  # No console window: log to a file instead.
  file:
    name: ${app.data-dir}/logs/learning-tracker.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7
